# 线上部署：应用 + MySQL + Caddy。由 deploy/deploy.sh 调用：
#   docker compose --env-file deploy/server.env -f deploy/docker-compose.prod.yml up -d --build
# server.env 只保存在服务器上（访问口令、MySQL 密码），首次部署时随机生成，重新部署不会覆盖。
# 两种访问方式（由 CADDYFILE 选择）：
#   Caddyfile       域名 + 自动 HTTPS（默认，境外地域或已备案的域名）
#   Caddyfile.http  直接用 IP 通过 HTTP 访问（国内地域、域名还没备案时）
name: recruit

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: recruit
      MYSQL_USER: recruit
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?缺少 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?缺少 MYSQL_PASSWORD}
    # 小内存服务器（2G）：把 InnoDB 缓冲池限制在 128M
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin", "--innodb-buffer-pool-size=128M"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  recruit-ai:
    build:
      context: ..
      args:
        # 国内服务器设置 PIP_INDEX_URL=https://mirrors.cloud.tencent.com/pypi/simple 可加速依赖安装
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: recruit-ai:latest
    env_file:
      - path: ../.env            # 大模型、企微、腾讯文档等配置（由部署脚本从本机复制）
        required: false
      - path: server.env         # 仅服务器保存：访问口令、MySQL 密码
        required: false
    environment:
      DATABASE_URL: mysql://recruit:${MYSQL_PASSWORD}@mysql:3306/recruit
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ../data:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?请设置 DOMAIN}
    volumes:
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - recruit-ai
    restart: unless-stopped

volumes:
  mysql_data:
  caddy_data:
