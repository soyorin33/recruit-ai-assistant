name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 测试 + 评测
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: recruit_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_pw --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 运行测试（SQLite）
        run: python -m pytest -q
      - name: 运行测试（MySQL 8.4）
        env:
          TEST_DATABASE_URL: mysql://root:ci_root_pw@127.0.0.1:3306/recruit_test
        run: python -m pytest -q
      - name: 抽取准确率评测（规则引擎）
        run: python -m eval.run_eval
      - name: 演示数据一致性检查
        run: |
          python -c "from app.db import DB; from app.seed import seed; d = DB('ci.db'); seed(d, 'hi')"
          python -m scripts.check_db ci.db

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: docker build -t recruit-ai:ci .
      - name: 启动并健康检查（SQLite 单容器）
        run: |
          docker run -d --name app -p 8000:8000 recruit-ai:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
          curl -sf localhost:8000/healthz || (docker logs app; exit 1)
          docker rm -f app
      - name: docker compose 启动（应用 + MySQL）并检查
        run: |
          echo "MYSQL_PASSWORD=ci_$(openssl rand -hex 8)" > .env
          docker compose up -d --build
          for i in $(seq 1 90); do curl -sf localhost:8000/healthz && break; sleep 2; done
          curl -sf localhost:8000/healthz || (docker compose logs; exit 1)
          docker compose exec -T recruit-ai python -m scripts.check_db
          docker compose down -v
