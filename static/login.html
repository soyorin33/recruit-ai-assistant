<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 招聘助手</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232a78d6'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif'>聘</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .login-card { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 24px; }
    .login-card .brand { margin-bottom: 20px; }
    .login-card label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
    .login-card input { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; font: inherit; background: var(--surface); color: var(--text); outline: none; }
    .login-card input:focus { border-color: var(--accent); }
    .login-card .btn { width: 100%; justify-content: center; margin-top: 14px; height: 38px; }
    .login-err { color: var(--critical-ink); font-size: 13px; min-height: 20px; margin-top: 8px; }
    .login-tip { color: var(--text-3); font-size: 12px; margin-top: 12px; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="login-wrap">
    <form class="login-card" id="form">
      <div class="brand">
        <div class="brand-logo">聘</div>
        <div><h1>招聘助手</h1><p>候选人数据仅限授权人员访问</p></div>
      </div>
      <label for="token">访问口令</label>
      <input id="token" type="password" autocomplete="current-password" required autofocus>
      <button class="btn primary" type="submit" id="submit">进入</button>
      <div class="login-err" id="err" role="alert"></div>
      <p class="login-tip">口令由管理员在服务器环境变量 ACCESS_TOKEN 中设置。</p>
    </form>
  </main>
  <script>
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submit"), err = document.getElementById("err");
      btn.disabled = true; err.textContent = "";
      try {
        const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: document.getElementById("token").value }) });
        if (r.ok) { location.href = "/"; return; }
        err.textContent = (await r.json().catch(() => ({}))).detail || "登录失败";
      } catch { err.textContent = "网络错误，请重试"; }
      btn.disabled = false;
    });
  </script>
</body>
</html>
